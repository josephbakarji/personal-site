<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — josephbakarji.com</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
  <link rel="stylesheet" href="/admin/static/dashboard.css">
</head>
<body>

<div class="admin-header">
  <h1>
    <span>~/admin/</span>
    <a href="/admin/dashboard" class="nav-link active">dashboard</a>
    <a href="/admin/" class="nav-link">articles</a>
    <a href="/admin/workflow" class="nav-link">workflow</a>
  </h1>
  <div class="toolbar">
    <button class="btn btn-green" id="btn-new-idea">+ New Idea</button>
  </div>
</div>

<div class="dashboard">
  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search memos, sessions, projects..." autocomplete="off">
    <button class="btn btn-sm" id="btn-search">Search</button>
  </div>
  <div id="search-results" class="search-results" style="display:none"></div>

  <!-- Stats Bar -->
  <div class="stats-bar" id="stats-bar"></div>

  <!-- Ideas Pipeline -->
  <section class="section">
    <h2 class="section-title">Ideas Pipeline</h2>
    <div class="pipeline" id="pipeline"></div>
  </section>

  <!-- Recent Voice Memos -->
  <section class="section">
    <h2 class="section-title">Recent Voice Memos</h2>
    <div class="memo-list" id="memo-list"></div>
  </section>

  <!-- Recent Sessions -->
  <section class="section">
    <h2 class="section-title">Recent Sessions</h2>
    <div class="session-list" id="session-list"></div>
  </section>

  <!-- Projects -->
  <section class="section">
    <div class="section-header-row">
      <h2 class="section-title">Projects</h2>
      <div class="project-controls">
        <div class="filter-tabs" id="project-filter">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="active">Active</button>
          <button class="filter-tab" data-filter="paused">Paused</button>
          <button class="filter-tab" data-filter="has-deadline">Has deadline</button>
        </div>
        <div class="sort-tabs" id="project-sort">
          <span class="sort-label">Sort:</span>
          <button class="sort-tab active" data-sort="priority">Priority</button>
          <button class="sort-tab" data-sort="deadline">Deadline</button>
          <button class="sort-tab" data-sort="modified">Modified</button>
        </div>
      </div>
    </div>
    <div class="project-list" id="project-list"></div>
  </section>

  <!-- Papers -->
  <section class="section">
    <h2 class="section-title">Papers</h2>
    <div class="paper-list" id="paper-list"></div>
  </section>
</div>

<!-- Idea Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">New Idea</h3>
      <button class="btn btn-sm" id="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Title</label><input id="idea-title" type="text"></div>
      <div class="field"><label>Stage</label>
        <select id="idea-stage">
          <option value="raw">raw</option>
          <option value="exploring">exploring</option>
          <option value="prototype">prototype</option>
          <option value="draft">draft</option>
          <option value="submittable">submittable</option>
          <option value="published">published</option>
          <option value="parked">parked</option>
        </select>
      </div>
      <div class="field"><label>Tags (comma-separated)</label><input id="idea-tags" type="text"></div>
      <div class="field"><label>Origin</label><input id="idea-origin" type="text" placeholder="voice-memo:ID or conversation"></div>
      <div class="field"><label>Linked Project</label><input id="idea-project" type="text"></div>
      <div class="field"><label>Linked Article (slug)</label><input id="idea-article" type="text"></div>
      <div class="field"><label>Notes</label><textarea id="idea-notes" rows="3"></textarea></div>
      <div class="field">
        <label>Sessions</label>
        <div id="idea-sessions-list" class="idea-sessions-list"></div>
        <div class="session-link-row">
          <select id="idea-session-select"><option value="">-- select session --</option></select>
          <button class="btn btn-sm" id="btn-link-session">+ link</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-red" id="modal-delete" style="display:none">Delete</button>
      <button class="btn btn-green" id="modal-save">Save</button>
    </div>
  </div>
</div>

<!-- Project Modal -->
<div class="modal-overlay" id="proj-modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="proj-modal-title">Edit Project</h3>
      <button class="btn btn-sm" id="proj-modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Project</label>
        <div id="proj-path" class="proj-readonly"></div>
      </div>
      <div class="field"><label>Priority (1-10)</label>
        <select id="proj-priority">
          <option value="">-- unset --</option>
          <option value="10">10 (highest)</option>
          <option value="9">9</option>
          <option value="8">8</option>
          <option value="7">7</option>
          <option value="6">6</option>
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3">3</option>
          <option value="2">2</option>
          <option value="1">1 (lowest)</option>
        </select>
      </div>
      <div class="field"><label>Deadline</label><input id="proj-deadline" type="date"></div>
      <div class="field"><label>Status</label>
        <select id="proj-status">
          <option value="active">active</option>
          <option value="paused">paused</option>
          <option value="completed">completed</option>
          <option value="archived">archived</option>
        </select>
      </div>
      <div class="field">
        <label>Collaborators</label>
        <div id="proj-collab-list" class="collab-chip-list"></div>
        <div class="collab-add-row">
          <input id="proj-collab-input" type="text" list="collab-datalist" placeholder="Add collaborator...">
          <datalist id="collab-datalist"></datalist>
          <button class="btn btn-sm" id="btn-add-collab">+</button>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="proj-notes" rows="3"></textarea></div>
      <div class="field proj-info-row">
        <span id="proj-modified"></span>
        <span id="proj-badges"></span>
      </div>
    </div>
    <div class="modal-footer">
      <div></div>
      <button class="btn btn-green" id="proj-modal-save">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/admin/static/dashboard.js"></script>
</body>
</html>
